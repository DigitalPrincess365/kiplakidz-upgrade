services:
  web:
    image: oven/bun:1-debian
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: ["sh", "-ec", "bun install --frozen-lockfile && exec bun run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=.${BASE44_SANDBOX_HOST_DOMAIN}
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - /run/base44/app.env
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:5173/').then(r => { if (!r.ok) process.exit(1); return r.text(); }).then(body => { if (!body.includes('/kipla-preview/index.html')) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: on-failure

volumes:
  node_modules:
